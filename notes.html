<!-- Theme: the visitor's saved choice always wins; system preference only until they pick one -->
<script>
  (function () {
    var t = null, k = 'ka-theme';
    try { t = localStorage.getItem(k) || localStorage.getItem('theme'); } catch (e) {}
    if (!t) { try { t = sessionStorage.getItem(k); } catch (e) {} }
    if (!t) { var m = document.cookie.match(/(?:^|; )ka-theme=(light|dark)/); if (m) t = m[1]; }
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-ka-theme', t);
  })();
</script>
